[package]
categories  = { workspace = true }
description = "Shared utilities for SQLite zone demo crates"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "demo-sqlite-common"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
arboard                   = "3.4.1"
argon2                    = { version = "0.5", features = ["zeroize", "std"] }
block-padding             = { version = "0.3", features = ["std"] }
chacha20poly1305          = { version = "0.10", features = ["std"] }
chrono                    = { version = "0.4", features = ["serde"] }
crypto-common             = { version = "0.1.6", features = ["std"] }
directories               = "6.0"
logos-blockchain-zone-sdk = { path = "../../../zone-sdk" }
nanosql                   = { version = "0.10.0", features = ["chrono"] }
rand                      = { version = "0.9" }
ratatui                   = { version = "0.29", features = ["serde"] }
serde                     = { features = ["derive"], workspace = true }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
tracing-subscriber        = { features = ["env-filter"], version = "0.3" }
zeroize                   = { workspace = true, features = ["alloc"] }

[dev-dependencies]
rand   = { version = "0.9" }
zxcvbn = "3"
