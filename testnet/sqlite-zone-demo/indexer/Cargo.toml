[package]
categories  = { workspace = true }
description = "Sqlite zone indexer"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "demo-sqlite-indexer"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
futures                   = { default-features = false, version = "0.3" }
hex                       = "0.4"
lb-common-http-client     = { workspace = true }
lb-core                   = { workspace = true }
logos-blockchain-zone-sdk = { path = "../../../zone-sdk" }
demo-sqlite-sequencer     = { path = "../sequencer" }
owo-colors                = { default-features = false, version = "4.2.3" }
reqwest                   = { features = ["json", "rustls-tls"], workspace = true }
rusqlite                  = { version = "0.38.0", features = ["bundled"] }
serde                     = { features = ["derive"], workspace = true }
thiserror                 = { workspace = true }
tokio                     = { default-features = false, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"], version = "1" }
tokio-util                = { version = "0.7" }
tracing                   = { workspace = true }
tracing-subscriber        = { features = ["env-filter"], version = "0.3" }
