[package]
categories  = { workspace = true }
description = "Sqlite sequencer"
edition     = { workspace = true }
keywords    = { workspace = true }
license     = { workspace = true }
name        = "demo-sqlite-sequencer"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[lints]
workspace = true

[dependencies]
clap                             = { features = ["derive", "env", "std"], version = "4" }
rusqlite                         = { version = "0.38.0", features = ["bundled", "trace"] }
hex                              = "0.4"
lb-common-http-client            = { workspace = true }
lb-core                          = { workspace = true }
lb-key-management-system-service = { workspace = true }
logos-blockchain-zone-sdk        = { path = "../../../zone-sdk" }
owo-colors                       = { default-features = false, version = "4.2.3" }
rand                             = { workspace = true }
reqwest                          = { features = ["json", "rustls-tls"], workspace = true }
serde                            = { features = ["derive"], workspace = true }
thiserror                        = { workspace = true }
tokio                            = { default-features = false, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"], version = "1" }
tokio-util                       = { version = "0.7" }
tracing                          = { workspace = true }
tracing-subscriber               = { features = ["env-filter"], version = "0.3" }
fs2                              = "0.4"
serde_json.workspace = true
